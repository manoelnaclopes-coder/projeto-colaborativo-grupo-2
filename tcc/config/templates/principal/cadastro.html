{%load static%}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{%static 'css/login.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
    <title>Login</title>
</head>

<body>

    <div class="logo">

        <img src="{% static 'logo-original.png'%}" alt="logo" width="300px" height="150px">
    </div>

    <h1 class="texto"> <strong> StartInTech </strong></h1>
    <h3 class="bem-vindo-cadastro">Seja bem-vindo!</h3>
    <h4 class="descricao">Entre na sua conta para adquirir muito conhecimento</h4>

    
        <button type="button" class="btn-cor">☀️</button>
    
    

    <div class="login">

        <form method="POST">
            {% csrf_token %}

            <div class="form-field">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Escreva seu nome aqui" required>
            </div>


            <div class="form-field">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Escreva seu e-mail aqui" required>
            </div>

            <div class="form-field">
                <label for="password1" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password1" name="senha" placeholder="Escreva sua senha" required>
            </div>

                <button type="submit" class="btn-solid"><strong>Enviar</strong></button>
               <a href="{% url 'entrar' %}"> <button type="button" class="btn-solid"><strong>Entrar</strong></button> </a>

        </form>

        
    </div>

</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'javascript/js.js' %}"></script>

</html>
